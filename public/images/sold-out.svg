<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035"
        numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
        scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <mask id="distress">
      <rect width="100%" height="100%" fill="white"/>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.08"
          numOctaves="3" seed="8"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 1 1"/>
          <feFuncG type="discrete" tableValues="0 1 1"/>
          <feFuncB type="discrete" tableValues="0 1 1"/>
        </feComponentTransfer>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain)" opacity=".28"/>
    </mask>
  </defs>

  <g transform="translate(500 250) rotate(-9)" fill="none"
     stroke="#d71920" stroke-linejoin="round" filter="url(#rough)">
    <circle r="190" stroke-width="9"/>
    <circle r="174" stroke-width="3"/>

    <g fill="#d71920" stroke="none">
      <path d="M0 -155 L12 -120 L49 -120 L19 -98 L30 -62 L0 -84 L-30 -62 L-19 -98 L-49 -120 L-12 -120Z"/>
      <path d="M-110 -120 L-102 -99 L-80 -99 L-98 -86 L-91 -65 L-110 -78 L-129 -65 L-122 -86 L-140 -99 L-118 -99Z"/>
      <path d="M110 -120 L118 -99 L140 -99 L122 -86 L129 -65 L110 -78 L91 -65 L98 -86 L80 -99 L102 -99Z"/>
      <path d="M0 155 L12 120 L49 120 L19 98 L30 62 L0 84 L-30 62 L-19 98 L-49 120 L-12 120Z"/>
    </g>

    <rect x="-455" y="-105" width="910" height="210"
      rx="18" stroke-width="11" fill="none"/>
    <rect x="-438" y="-88" width="876" height="176"
      rx="10" stroke-width="3"/>

    <text x="0" y="37"
      text-anchor="middle"
      fill="#d71920"
      stroke="none"
      font-family="Impact, Arial Black, sans-serif"
      font-size="155"
      font-weight="900"
      letter-spacing="2">SOLD OUT</text>
  </g>
</svg>
